<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tidy Tasks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one centered working column — header with progress, add bar, filter row, list, footer. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --fg:#17202c; --muted:#5f6b7a; --line:#dde3ea;
  --accent:#2f5bea; --accent-soft:#e6ecfd; --done:#1f9d6b; --high:#d2452f; --med:#c98a12; --low:#6b7a8c;
  --font-display:"Space Grotesk", ui-sans-serif, system-ui, sans-serif;
  --font-body:"Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#171e28; --fg:#e7ecf2; --muted:#94a0b0; --line:#2a3442;
  --accent:#7d9bff; --accent-soft:#1f2a45; --done:#3cc48d; --high:#f0735e; --med:#e5ad3e; --low:#8a98aa; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#171e28; --fg:#e7ecf2; --muted:#94a0b0; --line:#2a3442;
  --accent:#7d9bff; --accent-soft:#1f2a45; --done:#3cc48d; --high:#f0735e; --med:#e5ad3e; --low:#8a98aa; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:40px 56px}
.app{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-direction:column;gap:10px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:var(--font-display);font-weight:700;font-size:2rem;margin:0;letter-spacing:-.01em}
.date{color:var(--muted);font-size:.85rem}
.progress{display:flex;align-items:center;gap:12px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--done);width:0;transition:width .3s ease}

form.add{display:flex;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px}
form.add input{flex:1 1 220px;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;padding:8px 10px;outline:none}
select,button{font:inherit;color:inherit}
form.add select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px}
.btn{border:0;border-radius:8px;padding:8px 16px;font-weight:600;cursor:pointer}
.btn-primary{background:var(--accent);color:var(--surface)}
.btn-primary:hover{filter:brightness(1.08)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:4px 12px;font-size:.85rem;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.spacer{flex:1}
.link{background:none;border:0;color:var(--muted);font-size:.85rem;cursor:pointer;padding:4px 6px}
.link:hover{color:var(--high)}

ul.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
li.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
li.item:first-child{border-top:0}
.check{appearance:none;width:20px;height:20px;flex:none;border:2px solid var(--line);border-radius:6px;cursor:pointer;display:grid;place-items:center;margin:0;background:var(--surface)}
.check:checked{background:var(--done);border-color:var(--done)}
.check:checked::after{content:"";width:5px;height:10px;border:solid var(--surface);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.text{flex:1;min-width:0;overflow-wrap:anywhere;cursor:text}
li.done .text{color:var(--muted);text-decoration:line-through}
.edit{flex:1;min-width:0;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--accent);border-radius:6px;padding:4px 8px}
.prio{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid currentColor;flex:none}
.prio.high{color:var(--high)} .prio.med{color:var(--med)} .prio.low{color:var(--low)}
.del{opacity:0;background:none;border:0;cursor:pointer;color:var(--muted);font-size:1.2rem;line-height:1;padding:2px 6px;border-radius:6px}
li.item:hover .del,.del:focus-visible{opacity:1}
.del:hover{color:var(--high)}
@media (hover:none){.del{opacity:1}}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.foot{font-size:.8rem;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){.bar span{transition:none}}
</style>
</head>
<body>
<main class="app">
  <header>
    <div class="top">
      <h1>Tidy Tasks</h1>
      <span class="date" id="today"></span>
    </div>
    <div class="progress"><div class="bar"><span id="barFill"></span></div><span id="progressText">0 of 0 done</span></div>
  </header>

  <form class="add" id="addForm" autocomplete="off">
    <label for="newTask" hidden>New task</label>
    <input id="newTask" placeholder="Add a task and press Enter" maxlength="200">
    <label for="newPrio" hidden>Priority</label>
    <select id="newPrio">
      <option value="low">Low</option>
      <option value="med" selected>Medium</option>
      <option value="high">High</option>
    </select>
    <button class="btn btn-primary" type="submit">Add</button>
  </form>

  <div class="filters" role="group" aria-label="Filter tasks">
    <button class="chip" data-filter="all" aria-pressed="true" id="f-all">All</button>
    <button class="chip" data-filter="active" aria-pressed="false" id="f-active">Active</button>
    <button class="chip" data-filter="done" aria-pressed="false" id="f-done">Done</button>
    <span class="spacer"></span>
    <button class="link" id="clearDone">Clear completed</button>
  </div>

  <ul class="list" id="list"></ul>
  <p class="foot">Double-click a task to edit it. Tasks are saved in this browser. The starting tasks are examples.</p>
</main>

<script>
const KEY = "tidy-tasks-v1";
const sample = [
  {text:"Prepare slides for Thursday demo", prio:"high", done:false},
  {text:"Reply to design feedback thread", prio:"med", done:false},
  {text:"Book meeting room for retro", prio:"low", done:true},
  {text:"Review pull request for login flow", prio:"med", done:false},
].map((t,i)=>({id:Date.now()+i, ...t}));

let tasks = load();
let filter = "all";
let editing = null;

function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return sample;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(tasks)); }catch(e){} }

const $ = s => document.querySelector(s);
const list = $("#list");
$("#today").textContent = new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});

const prioOrder = {high:0, med:1, low:2};
const prioLabel = {high:"High", med:"Med", low:"Low"};

function render(){
  const shown = tasks
    .filter(t => filter==="all" || (filter==="done" ? t.done : !t.done))
    .sort((a,b) => (a.done - b.done) || (prioOrder[a.prio]-prioOrder[b.prio]));
  list.innerHTML = "";
  if(!shown.length){
    const li = document.createElement("li");
    li.className = "empty";
    li.textContent = filter==="done" ? "Nothing finished yet." : filter==="active" ? "All clear. Nothing left to do." : "No tasks yet. Add one above.";
    list.append(li);
  }
  for(const t of shown){
    const li = document.createElement("li");
    li.className = "item" + (t.done ? " done" : "");
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.className = "check"; cb.checked = t.done; cb.id = "c"+t.id;
    cb.setAttribute("aria-label", "Mark “"+t.text+"” done");
    cb.addEventListener("change", () => { t.done = cb.checked; save(); render(); });
    li.append(cb);

    if(editing === t.id){
      const inp = document.createElement("input");
      inp.className = "edit"; inp.value = t.text; inp.id = "e"+t.id; inp.maxLength = 200;
      const commit = () => { const v = inp.value.trim(); if(v) t.text = v; editing = null; save(); render(); };
      inp.addEventListener("keydown", e => { if(e.key==="Enter") commit(); if(e.key==="Escape"){ editing=null; render(); } });
      inp.addEventListener("blur", commit);
      li.append(inp);
      requestAnimationFrame(() => { inp.focus(); inp.select(); });
    } else {
      const span = document.createElement("span");
      span.className = "text"; span.textContent = t.text; span.title = "Double-click to edit";
      span.addEventListener("dblclick", () => { editing = t.id; render(); });
      li.append(span);
    }

    const p = document.createElement("span");
    p.className = "prio " + t.prio; p.textContent = prioLabel[t.prio];
    li.append(p);

    const del = document.createElement("button");
    del.className = "del"; del.innerHTML = "&times;"; del.setAttribute("aria-label","Delete “"+t.text+"”");
    del.addEventListener("click", () => { tasks = tasks.filter(x => x.id!==t.id); save(); render(); });
    li.append(del);
    list.append(li);
  }
  const done = tasks.filter(t=>t.done).length;
  $("#progressText").textContent = `${done} of ${tasks.length} done`;
  $("#barFill").style.width = tasks.length ? (done/tasks.length*100)+"%" : "0";
  $("#clearDone").hidden = done === 0;
}

$("#addForm").addEventListener("submit", e => {
  e.preventDefault();
  const v = $("#newTask").value.trim();
  if(!v) return;
  tasks.push({id:Date.now(), text:v, prio:$("#newPrio").value, done:false});
  $("#newTask").value = "";
  if(filter==="done") setFilter("all");
  save(); render();
});

function setFilter(f){
  filter = f;
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.filter===f));
  render();
}
document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => setFilter(c.dataset.filter)));
$("#clearDone").addEventListener("click", () => { tasks = tasks.filter(t=>!t.done); save(); render(); });

render();
</script>
</body>
</html>
